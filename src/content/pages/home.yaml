seo:
  title: Release Wellness
  description: Healing that meets you in rhythm with nature. Trauma-informed therapy integrating EMDR, somatic, sound, aromatherapy, and nature-based approaches in San Clemente, California.
hero:
  heading: Using elements of nature to nurture.
  lede: Trauma-informed therapy integrating somatic healing, EMDR, sound-based practices, and nature-centered grounding.
  image: /src/assets/hero-driftwood.webp
welcome:
  heading: Therapy moves at the pace of safety.
  body: |-
    You don't have to force your way through healing alone or in spaces that feel clinical, rushed, or disconnected.

    My work honors the nervous system, the body, and the quiet intelligence that already exists within you.
  image: /src/assets/approach-leaves.jpg
services_heading: Ways we might work together
feelings:
  items:
    - Overwhelmed and anxious
    - Consumed with fear
    - Lost with no real identity
    - Carrying something heavy and secret
  closing: Whatever it is, you don't have to do it alone.
about_preview:
  heading: Clinical training, embodied healing.
  body: |-
    I'm a therapist who integrates clinical training with embodied, experiential healing. My work blends trauma-informed care with client-centered therapies, helping you reconnect to yourself in ways that feel grounded, not forced.

    I believe healing happens in connection, relationship, safety, and attunement — not urgency.
  image: /src/assets/tanya-headshot.webp
  image_alt: Tanya L. Hauer
cta:
  heading: Shall we begin?
  body: If something here resonates, I welcome you to reach out.
