seo:
  title: Services
  description: Trauma-informed therapy integrating EMDR, somatic, nature-based, sound, and aromatherapy work — shaped around what you need.
heading: The work, centered around you.
intro: Therapy is not one-size-fits-all. The work we do together is shaped around what you need, how your system responds, and what feels most supportive to you.
help_with:
  heading: Some of what brings people here
  items:
    - Trauma, past and present
    - Anxiety, overwhelm, and nervous system dysregulation
    - Life transitions, grief, and relational wounds
    - Divorce, infidelity, emotional affairs
    - Integration work using EMDR + mindfulness-based approaches
therapy_is:
  heading: Performance. Pressure. Analysis alone.
  items:
    - Slowing down enough to notice what’s actually happening inside
    - Learning to feel safe in your own nervous system
    - Rebuilding connection to self, body, and environment
    - Creating space for what has been held alone for too long
modalities_heading: How we might work together
modalities:
  - title: Somatic therapy
    home_summary: Listening through the body — sensation, breath, and posture — alongside what we say out loud.
    description: 'Listening through the body: sensation, breath, posture, and movement, alongside what we say out loud. Somatic work helps the nervous system process what can’t always be reached by talk alone.'
  - title: EMDR
    home_summary: Trauma reprocessing at the nervous-system level, moving through what is stuck rather than only talking about it.
    description: Eye Movement Desensitization and Reprocessing, a research-backed approach for trauma reprocessing at the nervous system level. EMDR helps you move through what is stuck rather than only talking about it.
  - title: Nature-based therapy
    home_summary: Drawing on the natural world to help you settle, regulate, and reconnect.
    description: Sessions that draw on the natural world to help you settle, regulate, and reconnect. Nature offers a steady reference point for a system learning what safety feels like.
  - title: Sound healing
    home_summary: Sound healing uses intentional frequencies, vibration, and rhythm to support grounding and energetic balance. Through singing bowls, various therapeutic tones, and drumming, sound can regulate the nervous system, create space for emotional release, restoration, and deeper connection within the body.
    description: Sound healing uses intentional frequencies, vibration, and rhythm to support grounding and energetic balance.
  - title: Aromatherapy
    home_summary: Essential oils are used as a gentle sensory-based way to support emotional and nervous system healing to help calm the body, ease anxiety, and promote a sense of safety and balance. Scent connects directly to the brain's emotional centers, making it a powerful, natural complement to trauma work and overall healing.
    description: Essential oils are used as a gentle sensory-based way to support emotional and nervous system healing to help calm the body, ease anxiety, and promote a sense of safety and balance.
cta:
  heading: Ready to talk?
  body: A consult is a chance to meet, ask questions, and see if working together feels right.
